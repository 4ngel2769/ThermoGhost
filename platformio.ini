[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0

; ── The TollanAgent library ───────────────────────────────────────────────
; It is proprietary ("licensed only for use with the Tollan service") and is
; NOT in this repo. Copy the TollanAgent/ folder out of your device bundle
; into lib/ — see lib/README.md.
;
; It ships PRECOMPILED: one static archive per chip under
; lib/TollanAgent/src/<chip>/. So every env has to point the linker at the
; right one with -L <dir> -lTollanAgent, or you get undefined references to
; tollan::TollanAgent::*.
;
;   esp32    - classic ESP32 (WROOM-32 / DevKitC / NodeMCU-32S)
;   esp32s2  - ESP32-S2 (LOLIN S2 Mini, Saola-1)
;   esp32s3  - ESP32-S3
;   esp32c3  - ESP32-C3 (SuperMini, DevKitM-1, ...)

; ESP32-S2 Mini (WEMOS LOLIN S2 Mini)
[env:esp32s2mini]
board = lolin_s2_mini
; fallback if your board isn't a LOLIN S2 Mini: board = esp32-s2-saola-1
build_flags =
    -DBOARD_HAS_PSRAM
    -L lib/TollanAgent/src/esp32s2 -lTollanAgent

; Classic ESP32 (ESP32-WROOM-32 / DevKitC / NodeMCU-32S)
[env:esp32dev]
board = esp32dev
build_flags =
    -L lib/TollanAgent/src/esp32 -lTollanAgent

; ESP32-C3 (SuperMini / DevKitM-1)
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -L lib/TollanAgent/src/esp32c3 -lTollanAgent
