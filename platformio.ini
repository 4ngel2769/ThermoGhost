[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0

; ESP32-S2 Mini (WEMOS LOLIN S2 Mini)
[env:esp32s2mini]
board = lolin_s2_mini
; fallback if your board isn't a LOLIN S2 Mini: board = esp32-s2-saola-1
build_flags =
    -DBOARD_HAS_PSRAM

; Classic ESP32 (ESP32-WROOM-32 / DevKitC / NodeMCU-32S)
[env:esp32dev]
board = esp32dev